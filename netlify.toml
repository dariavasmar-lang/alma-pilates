[build]
  publish = "."

[dev]
  port = 8888
  publish = "."

# Platform Admin
[[redirects]]
  from = "/platform"
  to = "/Platform_Admin.html"
  status = 200

# Studio admin panel: /alma-pilates/admin → Admin HTML
[[redirects]]
  from = "/:slug/admin"
  to = "/Alma_Pilates_Admin.html"
  status = 200

# Studio client app: /alma-pilates → Client HTML
[[redirects]]
  from = "/:slug"
  to = "/Alma_Pilates_Client.html"
  status = 200

# Legacy redirects — old direct .html URLs → clean URLs
[[redirects]]
  from = "/Alma_Pilates_Client.html"
  to = "/alma-pilates"
  status = 301

[[redirects]]
  from = "/Alma_Pilates_Admin.html"
  to = "/alma-pilates/admin"
  status = 301

[[redirects]]
  from = "/Platform_Admin.html"
  to = "/platform"
  status = 301

# Old clean URLs from before multi-studio
[[redirects]]
  from = "/admin"
  to = "/alma-pilates/admin"
  status = 301
